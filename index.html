<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teste: qual é a sua ferida no amor?</title>
<meta name="description" content="8 perguntas rápidas. É só tocar na resposta.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.metodointimidade.com.br">
<link rel="preload" as="image" href="img/capa.webp">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Lato:wght@400;700&display=swap">
<style>
:root{--fundo:#FFFFFF;--cartao:#FAF7F2;--texto:#1A1714;--suave:#5C554C;--placeholder:#6F675D;--ouro:#C9A84C;--ouro-escuro:#8A6514;--borda:#E8E1D6;--trilho:#EFE9DF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--texto);font-family:Lato,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.tela{max-width:430px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:24px 20px 28px;display:flex;flex-direction:column;gap:20px}
.marca{display:flex;align-items:center;justify-content:center;gap:10px}
.marca span{font-family:Cinzel,serif;font-weight:600;font-size:13px;letter-spacing:.18em}
.selo{font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--ouro-escuro)}
h1{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:1.08}
.capa h1{font-size:42px;line-height:1.05}
.pergunta h1{font-size:32px;line-height:1.1}
p{margin:0}
.sub{font-size:17px;line-height:1.5;color:var(--suave)}
.capa-img{width:100%;aspect-ratio:350/300;object-fit:cover;border-radius:20px;display:block;background:var(--cartao)}
.cresce{flex-grow:1}
.botao{display:flex;align-items:center;justify-content:center;width:100%;height:58px;border:0;border-radius:14px;background:var(--texto);color:#fff;font-size:18px;font-weight:700;cursor:pointer;text-decoration:none}
.botao:disabled{opacity:.6;cursor:default}
.rodape{text-align:center;font-size:13px;color:var(--suave);line-height:1.5}
.rodape a{color:var(--suave)}
.topo{display:flex;flex-direction:column;gap:10px}
.topo-linha{display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--suave)}
.voltar{display:flex;align-items:center;min-height:48px;min-width:48px;padding:0 8px 0 0;background:none;border:0;color:var(--suave);cursor:pointer}
.contador{font-weight:700;color:var(--ouro-escuro)}
.barra{height:6px;border-radius:3px;background:var(--trilho);overflow:hidden}
.barra i{display:block;height:6px;border-radius:3px;background:var(--ouro);transition:width .3s}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opcao{position:relative;display:flex;flex-direction:column;border:1px solid var(--borda);border-radius:16px;overflow:hidden;background:var(--cartao);text-align:left;padding:0;cursor:pointer;min-height:48px}
.opcao.marcada{border:2px solid var(--ouro-escuro)}
.opcao .foto{width:100%;height:150px;object-fit:cover;display:block;background:var(--trilho)}
.opcao .cena{height:150px;display:flex;align-items:center;justify-content:center;padding:12px;font-size:13px;line-height:1.35;color:var(--suave);background:var(--trilho);text-align:center}
.opcao .txt{padding:12px 12px 14px;font-size:16px;font-weight:700;line-height:1.3}
.check{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:13px;background:var(--ouro-escuro);display:none;align-items:center;justify-content:center}
.opcao.marcada .check{display:flex}
.frases{display:flex;flex-direction:column;gap:12px}
.frase{position:relative;display:block;width:100%;text-align:left;padding:20px 52px 20px 20px;border:1px solid var(--borda);border-radius:16px;background:var(--cartao);font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-style:italic;font-size:23px;line-height:1.25;cursor:pointer;min-height:64px}
.frase.marcada{border:2px solid var(--ouro-escuro)}
.frase .check{top:50%;margin-top:-13px;right:14px}
.analise{align-items:stretch;gap:28px}
.anel{align-self:center;position:relative;width:150px;height:150px}
.anel span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:40px}
.passos{display:flex;flex-direction:column;gap:16px;padding:22px 20px;border-radius:16px;background:var(--cartao);border:1px solid var(--borda)}
.passos div{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--suave)}
.passos div.feito{color:var(--texto)}
.campo{display:flex;flex-direction:column;gap:8px}
.campo>span{font-size:15px;font-weight:700}
.entrada{display:flex;align-items:center;height:56px;padding:0 16px;border:1.5px solid var(--borda);border-radius:12px;font-size:17px;background:#fff}
.entrada:focus-within{border-color:var(--ouro-escuro)}
.entrada input{flex:1;min-width:0;border:0;outline:0;font-size:17px;background:transparent;height:100%}
.entrada input::placeholder{color:var(--placeholder)}
.ddi{padding-right:12px;margin-right:12px;border-right:1px solid var(--borda);font-weight:700}
.campo.erro .entrada{border-color:#B3261E}
.msg-erro{font-size:14px;color:#B3261E;display:none}
.campo.erro .msg-erro{display:block}
.aceite{display:flex;gap:14px;align-items:flex-start;min-height:48px;font-size:16px;line-height:1.45;cursor:pointer}
.aceite input{appearance:none;-webkit-appearance:none;flex-shrink:0;width:24px;height:24px;margin:1px 0 0;border-radius:6px;border:2px solid var(--ouro-escuro);background:#fff;display:grid;place-content:center;cursor:pointer}
.aceite input:checked{background:var(--ouro-escuro)}
.aceite input:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.aviso{font-size:15px;line-height:1.45;color:#B3261E;text-align:center;display:none}
.aviso.on{display:block}
@media (max-width:360px){.capa h1{font-size:36px}.pergunta h1{font-size:28px}.opcao .foto,.opcao .cena{height:128px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<noscript><p style="padding:24px;text-align:center">Ative o JavaScript para fazer o teste.</p></noscript>
<script src="conteudo.js"></script>
<script src="app.js"></script>
</body>
</html>
